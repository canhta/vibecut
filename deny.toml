[graph]
# Check the shipped platforms and every feature combination once, so the skip
# list below is host-independent and a Linux/macOS runner agrees with Windows.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[bans]
# Scoped library limits approved 2026-11-04; direct dependencies stay latest stable.
# No downgrades or third-party patches. Direct dependencies resolve to one version
# through the workspace table; every skip below is the older side of a duplicate
# that an upstream crate pins. Remove a skip when that parent adopts the version
# already used by the rest of the workspace.
multiple-versions = "deny"
skip = [
    # spm_precompiled 0.1.4 (from tokenizers) pins base64 0.13; ureq 2.12 and
    # usvg 0.45 pin 0.22. The workspace uses 0.23 for ai and vibecut-cli.
    { name = "base64", version = "=0.13.1" },
    { name = "base64", version = "=0.22.1" },
    # whisper-rs-sys 0.15 builds with bindgen 0.72; ffmpeg-sys-next 9 uses 0.73.
    { name = "bindgen", version = "=0.72.1" },
    # tokenizers -> fancy-regex 0.17 pins bit-set 0.8/bit-vec 0.8; naga/wgpu pin
    # bit-set 0.10/bit-vec 0.9; proptest and tract use 0.11/0.10.
    { name = "bit-set", version = "=0.8.0" },
    { name = "bit-set", version = "=0.10.0" },
    { name = "bit-vec", version = "=0.8.0" },
    { name = "bit-vec", version = "=0.9.1" },
    # png 0.17 (tiny-skia) and older macOS/BSD support crates still use bitflags 1.
    { name = "bitflags", version = "=1.3.2" },
    # winit 0.30 and accesskit_macos still build against objc2 0.5 generation.
    { name = "block2", version = "=0.5.1" },
    # sherpa-onnx-sys 2.0 compresses its native archive with bzip2 0.4; zip 9 uses 0.6.
    { name = "bzip2", version = "=0.4.4" },
    # winit 0.30's Wayland stack pins calloop 0.13; smithay-clipboard uses 0.14.
    { name = "calloop", version = "=0.13.0" },
    { name = "calloop-wayland-source", version = "=0.3.0" },
    # blake3 1.8 pins constant_time_eq 0.4; zip 9 uses 0.6.
    { name = "constant_time_eq", version = "=0.4.2" },
    # wayland-backend 0.3 pins downcast-rs 1; tract 0.23 uses 2.
    { name = "downcast-rs", version = "=1.2.1" },
    # tokenizers 0.23 pins fancy-regex 0.17; jsonschema 0.60 uses 0.19.
    { name = "fancy-regex", version = "=0.17.0" },
    # petgraph 0.8 (hashbrown 0.15) pins foldhash 0.1; hashbrown 0.17 uses 0.2.
    { name = "foldhash", version = "=0.1.5" },
    # ring 0.17 needs getrandom 0.2; ahash/rand 0.9 need 0.3; the workspace and
    # tempfile/zip/tract already use 0.4.
    { name = "getrandom", version = "=0.2.17" },
    { name = "getrandom", version = "=0.3.4" },
    # epaint 0.37 pins harfrust 0.12; text and skrifa 0.49 use 0.15.
    { name = "harfrust", version = "=0.12.0" },
    # petgraph 0.8 uses hashbrown 0.15, safetensors 0.8 uses 0.16; the engine/UI
    # stack uses 0.17.
    { name = "hashbrown", version = "=0.15.5" },
    { name = "hashbrown", version = "=0.16.1" },
    # bindgen 0.72, prost/tokenizers and egui/tract split itertools 0.13/0.14/0.15.
    { name = "itertools", version = "=0.13.0" },
    { name = "itertools", version = "=0.14.0" },
    # resvg 0.45 pins kurbo 0.11; vello/peniko 0.6 uses 0.13.
    { name = "kurbo", version = "=0.11.3" },
    # rustix 0.38 (winit/calloop 0.13) pins linux-raw-sys 0.4; rustix 1 uses 0.12.
    { name = "linux-raw-sys", version = "=0.4.15" },
    # png 0.17 pins miniz_oxide 0.8; flate2 and png 0.18 use 0.9.
    { name = "miniz_oxide", version = "=0.8.9" },
    # spm_precompiled and cexpr (bindgen 0.72) pin nom 7; tract 0.23 uses 8.
    { name = "nom", version = "=7.1.3" },
    # winit 0.30 and accesskit still use objc2 0.5 generation; the app/UI stack
    # (rfd, wgpu, egui, cpal) uses objc2 0.6.
    { name = "objc2", version = "=0.5.3" },
    { name = "objc2-app-kit", version = "=0.2.2" },
    { name = "objc2-foundation", version = "=0.2.2" },
    # mime_guess2 2.3 pins phf 0.11; accesskit 0.25 uses 0.14.
    { name = "phf", version = "=0.11.3" },
    { name = "phf_shared", version = "=0.11.3" },
    # tiny-skia 0.11 pins png 0.17; image 0.25 uses 0.18.
    { name = "png", version = "=0.17.16" },
    # rfd 0.17 pins pollster 0.4; eframe/egui_kittest use 1.0.
    { name = "pollster", version = "=0.4.0" },
    # candle/tokenizers still use rand 0.9; proptest and tract use 0.10. The
    # same split reaches rand_core and rand_distr.
    { name = "rand", version = "=0.9.5" },
    { name = "rand_core", version = "=0.9.5" },
    { name = "rand_distr", version = "=0.5.1" },
    # skrifa 0.44 (epaint) pins read-fonts 0.41; skrifa 0.49 uses 0.46.
    { name = "read-fonts", version = "=0.41.0" },
    # naga/wgpu pin rustc-hash 1; bindgen and type-map use 2.
    { name = "rustc-hash", version = "=1.1.0" },
    # winit 0.30's Wayland stack pins rustix 0.38; the workspace uses 1.1.
    { name = "rustix", version = "=0.38.44" },
    # bindgen 0.72 pins shlex 1; cc and bindgen 0.73 use 2.
    { name = "shlex", version = "=1.3.0" },
    # epaint 0.37 and glifo 0.3 pin skrifa 0.44; text/app use 0.49.
    { name = "skrifa", version = "=0.44.0" },
    # winit 0.30 pins smithay-client-toolkit 0.19; smithay-clipboard uses 0.20.
    { name = "smithay-client-toolkit", version = "=0.19.2" },
    # syn 2 is still required by bindgen 0.72, thiserror 1 and many proc-macro
    # crates; the workspace and newer macros use syn 3.
    { name = "syn", version = "=2.0.119" },
    # calloop 0.13 and smithay-client-toolkit 0.19 pin thiserror 1.
    { name = "thiserror", version = "=1.0.69" },
    { name = "thiserror-impl", version = "=1.0.69" },
    # The workspace crate `time` is a local package, not a registry version drift;
    # zip 9 pulls the crates.io `time` 0.3 for its file timestamps.
    { name = "time", version = "=0.1.0" },
    # glutin/winit/ring and file-id pin windows-sys 0.52/0.59/0.60; the workspace
    # and current platform crates use 0.61.
    { name = "windows-sys", version = "=0.52.0" },
    { name = "windows-sys", version = "=0.59.0" },
    { name = "windows-sys", version = "=0.60.2" },
    { name = "windows-targets", version = "=0.52.6" },
    # windows-sys 0.52/0.59 share the 0.52.6 architecture crates for our shipped
    # triples; windows-sys 0.60/0.61 use 0.53.1.
    { name = "windows_aarch64_msvc", version = "=0.52.6" },
    { name = "windows_x86_64_gnu", version = "=0.52.6" },
    { name = "windows_x86_64_msvc", version = "=0.52.6" },
]

[licenses]
# Admitted licences per docs/engineering/open-source.md#licensing. Anything else
# needs an ADR before it is added here.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# MPL-2.0 is admitted by the policy before any dependency uses it.
unused-allowed-license = "allow"
# Workspace crates (publish = false) are our own GPL-3.0-only code.
private = { ignore = true }
# Permissive licences outside the admitted list; each stays a per-crate exception
# until a licence ADR admits it (the policy sends every other licence to an ADR).
exceptions = [
    # MIT-0 (MIT without the notice requirement): fluent-uri.
    { allow = ["MIT-0"], crate = "borrow-or-share" },
    # BSL-1.0 (Boost): arboard clipboard on Windows (clipboard-win, error-code).
    { allow = ["BSL-1.0"], crate = "clipboard-win" },
    { allow = ["BSL-1.0"], crate = "error-code" },
    # 0BSD (public-domain-equivalent BSD): interprocess and its helpers.
    { allow = ["0BSD"], crate = "doctest-file" },
    { allow = ["0BSD"], crate = "recvmsg" },
    # bzip2-1.0.6 (BSD-style, from the bzip2 reference licence): bzip2 0.6 (zip).
    { allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" },
    # CC0-1.0 OR MIT-0: zip 9.
    { allow = ["CC0-1.0", "MIT-0"], crate = "ppmd-rust" },
]

[advisories]
# Every entry is an unmaintained-crate notice with no patched release, held by a
# direct dependency that is already the latest release. Drop an entry when the
# parent moves off the crate; a vulnerability is never ignored here.
unmaintained = "all"
ignore = [
    # paste (proc-macro): gemm 0.19 (candle-core 0.11, latest) uses it for
    # compile-time token pasting; it runs only at build time.
    { id = "RUSTSEC-2024-0436", reason = "build-time proc-macro under candle-core/gemm; no replacement released by the parent" },
    # zbus_names, zvariant, zvariant_derive: the project moved them into zbus 6;
    # accesskit_unix 0.24.1 (egui-winit/eframe 0.37, latest) still builds on
    # zbus 5. Linux accessibility transport only.
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 under accesskit_unix (Linux AT-SPI); parent not yet on zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 under accesskit_unix (Linux AT-SPI); parent not yet on zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 under accesskit_unix (Linux AT-SPI); parent not yet on zbus 6" },
]

[sources]
# Registry crates only; no git or alternate-registry dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
