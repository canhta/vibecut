[package]
name = "mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64.workspace = true
engine.workspace = true
interprocess = { version = "2.4.7", features = ["tokio"] }
project.workspace = true
rmcp = { workspace = true, default-features = false, features = ["server", "transport-io"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "io-std", "net"] }
tracing = { workspace = true, default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"
win-authorization-sys = "0.1.0"

[dev-dependencies]
ai.workspace = true
render.workspace = true
tempfile.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["test-util"] }
