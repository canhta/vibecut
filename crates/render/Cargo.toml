[package]
name = "render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
schemars.workspace = true
time.workspace = true
media.workspace = true
project.workspace = true
captions.workspace = true
text.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
rayon = "1.12.0"
# Sticker SVG rasterisation. Version and features match what egui_extras already resolves, so the
# lock gains no package; text and raster-image features stay off because bundled flags need neither.
resvg = { version = "0.45.1", default-features = false }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
testkit.workspace = true
# The content-time and quality proofs need a catalog kind that no production
# build carries (see project's `test-kinds` feature).
project = { workspace = true, features = ["test-kinds"] }
