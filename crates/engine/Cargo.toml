[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["whisper", "gipformer", "candle-align"]
whisper = ["ai/whisper"]
gipformer = ["ai/gipformer"]
candle-align = ["ai/candle-align"]

[dependencies]
ai = { path = "../ai", default-features = false }
project = { path = "../project" }
time = { path = "../time" }
media = { path = "../media" }
render = { path = "../render" }
captions = { path = "../captions" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-segmentation = "1.13.3"

blake3 = "1.8.7"
fs4 = "1.1.0"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
