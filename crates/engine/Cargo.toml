[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["whisper", "gipformer", "candle-align"]
whisper = ["ai/whisper"]
gipformer = ["ai/gipformer"]
candle-align = ["ai/candle-align"]
vision = ["ai/vision"]

[dependencies]
getrandom.workspace = true
jsonschema = { version = "0.60.2", default-features = false }
image = { workspace = true, default-features = false, features = ["jpeg", "png"] }
schemars.workspace = true
ai = { workspace = true, default-features = false }
project.workspace = true
time.workspace = true
media.workspace = true
render.workspace = true
captions.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
unicode-normalization.workspace = true

blake3.workspace = true
text.workspace = true
transport.workspace = true
fs4 = "1.1.0"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
file-id = "0.2.3"

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
testkit.workspace = true
