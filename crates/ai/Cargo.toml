[package]
name = "ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs"]
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]

[dependencies]
captions = { path = "../captions" }
time = { path = "../time" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
url = "2.5.8"

sha2 = "0.11.1"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", optional = true, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16.0", optional = true }

[dev-dependencies]
serde_json = "1.0.154"
