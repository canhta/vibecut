[package]
name = "ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
wildcard_imports = "warn"

[features]
default = ["whisper", "gipformer"]
whisper = ["dep:whisper-rs"]
gipformer = ["dep:sherpa-onnx"]
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]

[[bin]]
name = "vibecut-local-asr"
path = "src/bin/local_asr.rs"
required-features = ["gipformer"]

[dependencies]
sherpa-onnx = { version = "2.0.1", optional = true }
serde_json = "1.0.154"
captions = { path = "../captions" }
time = { path = "../time" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
url = "2.5.8"

sha2 = "0.11.1"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", optional = true, features = ["metal", "raw-api"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16.0", optional = true, features = ["raw-api"] }
