[package]
name = "ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
wildcard_imports = "warn"

[features]
default = ["whisper", "gipformer", "candle-align", "vision"]
vision = ["dep:tract-onnx", "dep:tract-linalg", "dep:rayon", "dep:tokenizers", "dep:prost"]
candle-align = ["dep:candle-core", "dep:candle-nn", "dep:tokenizers", "dep:rustfft"]
whisper = ["dep:whisper-rs"]
gipformer = ["dep:sherpa-onnx"]
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]

[[bin]]
name = "vibecut-local-asr"
path = "src/bin/local_asr.rs"
required-features = ["gipformer"]

[dependencies]
base64.workspace = true
prost = { version = "0.14.4", optional = true }
tract-onnx = { version = "=0.23.9", default-features = false, optional = true }
tract-linalg = { version = "=0.23.9", features = ["multithread-mm"], optional = true }
rayon = { version = "1.12.0", optional = true }
candle-core = { version = "0.11.1", default-features = false, optional = true }
candle-nn = { version = "0.11.1", default-features = false, optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
rustfft = { version = "6.4.1", optional = true }
sherpa-onnx = { version = "2.0.1", optional = true }
serde_json.workspace = true
captions.workspace = true
time.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
url = "2.5.8"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", optional = true, features = ["metal", "raw-api"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16.0", optional = true, features = ["raw-api"] }

[dev-dependencies]
testkit.workspace = true

[[example]]
name = "face_embedding"
required-features = ["vision"]

[[example]]
name = "local_alignment"
required-features = ["candle-align"]
