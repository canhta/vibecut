[package]
name = "media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
wildcard_imports = "warn"

[dependencies]
schemars.workspace = true
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
thiserror.workspace = true
time.workspace = true
serde = { workspace = true, features = ["derive"] }
blake3.workspace = true

[dev-dependencies]
serde_json.workspace = true
testkit.workspace = true
