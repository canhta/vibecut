[package]
name = "clip-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "clip-eval"
path = "src/main.rs"

[dependencies]
ai = { path = "../ai", default-features = false }
captions = { path = "../captions" }
engine = { path = "../engine" }
media = { path = "../media" }
time = { path = "../time" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
