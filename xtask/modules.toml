# Intra-crate layer table; imports point toward lower layers.
#
# A crate may also add `[[crate.folder]]` tables with `path = "src/<folder>"` and
# the same `layer` and `module` arrays, scoped to that folder's children.
[[crate]]
name = "engine"
path = "crates/engine"

[[crate.layer]]
name = "kernel"
groups = ["kernel"]

[[crate.layer]]
name = "substrate"
groups = ["substrate"]

[[crate.layer]]
name = "features"
groups = ["subtitles", "analysis", "artifacts"]

[[crate.layer]]
name = "control"
groups = ["control"]

[[crate.module]]
name = "session"
group = "kernel"

[[crate.module]]
name = "runtime"
group = "substrate"

[[crate.module]]
name = "store"
group = "substrate"

[[crate.module]]
name = "subtitles"
group = "subtitles"

[[crate.module]]
name = "analysis"
group = "analysis"

[[crate.module]]
name = "artifacts"
group = "artifacts"

[[crate.module]]
name = "providers"
group = "substrate"

[[crate.module]]
name = "transcript"
group = "substrate"

[[crate.module]]
name = "control"
group = "control"

# External asset libraries sit above engine; fonts and sounds are independent features.
[[crate]]
name = "libraries"
path = "crates/libraries"

[[crate.layer]]
name = "features"
groups = ["font_catalog", "audio_library", "brand_kit", "sticker_library"]

[[crate.module]]
name = "font_catalog"
group = "font_catalog"

[[crate.module]]
name = "sound_library"
group = "audio_library"

[[crate.module]]
name = "music_library"
group = "audio_library"

[[crate.module]]
name = "brand_kit"
group = "brand_kit"

[[crate.module]]
name = "sticker_library"
group = "sticker_library"

# Shorts operations are independent; only the suggestion workflow composes them.
[[crate]]
name = "shorts"
path = "crates/shorts"

[[crate.layer]]
name = "contract"
groups = ["error"]

[[crate.layer]]
name = "operations"
groups = ["boundaries", "batch_export"]

[[crate.layer]]
name = "workflow"
groups = ["suggestion"]

[[crate.layer]]
name = "composition"
groups = ["workflow_jobs"]

[[crate.module]]
name = "boundaries"
group = "boundaries"

[[crate.module]]
name = "batch_export"
group = "batch_export"

[[crate.module]]
name = "suggestion"
group = "suggestion"

[[crate.module]]
name = "workflow"
group = "workflow_jobs"

[[crate.module]]
name = "error"
group = "error"

# Desktop app: docs/engineering/structure.md#desktop-app-appsvibecutsrc.
# Foundation (kit, i18n, input) sits below the services. Home, Shorts and each
# editor area are independent features of one layer that import only
# foundation and services; the editor frame is the one module above them that
# calls each area, and the composition root (`app`) is the top layer.

[[crate]]
name = "vibecut"
path = "apps/vibecut"

[[crate.layer]]
name = "foundation"
groups = ["foundation"]

# Shared services sit below the windows and areas that call them.
[[crate.layer]]
name = "services"
groups = ["services"]

[[crate.layer]]
name = "windows"
groups = [
    "home",
    "shorts",
]

[[crate.layer]]
name = "frame"
groups = ["editor"]

[[crate.layer]]
name = "composition"
groups = ["app"]

[[crate.module]]
name = "kit"
group = "foundation"

[[crate.module]]
name = "i18n"
group = "foundation"

[[crate.module]]
name = "input"
group = "foundation"

[[crate.module]]
name = "services"
group = "services"

[[crate.module]]
name = "actions"
group = "editor"

[[crate.module]]
name = "preferences"
group = "editor"

[[crate.module]]
name = "app"
group = "app"

[[crate.module]]
name = "home"
group = "home"

[[crate.module]]
name = "editor"
group = "editor"

[[crate.module]]
name = "shorts"
group = "shorts"

# Editor areas expose a State and a show returning actions; the frame routes
# them, and the shared read/write context every area names sits lowest.
[[crate.folder]]
path = "src/editor"

[[crate.folder.layer]]
name = "contract"
groups = ["context"]

[[crate.folder.layer]]
name = "areas"
groups = ["dialogs", "panels", "timeline", "widgets"]

[[crate.folder.layer]]
name = "frame"
groups = ["frame"]

[[crate.folder.module]]
name = "context"
group = "context"

[[crate.folder.module]]
name = "timing"
group = "context"

[[crate.folder.module]]
name = "selection"
group = "context"

[[crate.folder.module]]
name = "dialogs"
group = "dialogs"

[[crate.folder.module]]
name = "panels"
group = "panels"

[[crate.folder.module]]
name = "timeline"
group = "timeline"

[[crate.folder.module]]
name = "widgets"
group = "widgets"

[[crate.folder.module]]
name = "state"
group = "frame"

[[crate.folder.module]]
name = "frame"
group = "frame"

# The two docked panels keep their own folder inside the editor; each owns one
# area state.
[[crate.folder]]
path = "src/editor/panels"

[[crate.folder.layer]]
name = "areas"
groups = ["assets", "panels", "properties"]

[[crate.folder.module]]
name = "assets"
group = "assets"

[[crate.folder.module]]
name = "player"
group = "panels"

[[crate.folder.module]]
name = "properties"
group = "properties"
