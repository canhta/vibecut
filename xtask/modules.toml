# Intra-crate layer table; imports point toward lower layers.
#
# A crate may also add `[[crate.folder]]` tables with `path = "src/<folder>"` and
# the same `layer` and `module` arrays, scoped to that folder's children. The
# editor table lands with its area split; none are configured yet.
[[crate]]
name = "engine"
path = "crates/engine"

[[crate.layer]]
name = "kernel"
groups = ["kernel"]

[[crate.layer]]
name = "substrate"
groups = ["substrate"]

[[crate.layer]]
name = "features"
groups = ["subtitles", "analysis", "artifacts"]

[[crate.layer]]
name = "control"
groups = ["control"]

[[crate.module]]
name = "session"
group = "kernel"

[[crate.module]]
name = "runtime"
group = "substrate"

[[crate.module]]
name = "store"
group = "substrate"

[[crate.module]]
name = "subtitles"
group = "subtitles"

[[crate.module]]
name = "analysis"
group = "analysis"

[[crate.module]]
name = "artifacts"
group = "artifacts"

[[crate.module]]
name = "providers"
group = "substrate"

[[crate.module]]
name = "transcript"
group = "substrate"

[[crate.module]]
name = "control"
group = "control"

# External asset libraries sit above engine; fonts and sounds are independent features.
[[crate]]
name = "libraries"
path = "crates/libraries"

[[crate.layer]]
name = "features"
groups = ["font_catalog", "sound_library"]

[[crate.module]]
name = "font_catalog"
group = "font_catalog"

[[crate.module]]
name = "sound_library"
group = "sound_library"

# Shorts operations are independent; only the suggestion workflow composes them.
[[crate]]
name = "shorts"
path = "crates/shorts"

[[crate.layer]]
name = "operations"
groups = ["boundaries", "batch_export"]

[[crate.layer]]
name = "workflow"
groups = ["suggestion"]

[[crate.module]]
name = "boundaries"
group = "boundaries"

[[crate.module]]
name = "batch_export"
group = "batch_export"

[[crate.module]]
name = "suggestion"
group = "suggestion"

# Desktop app: docs/engineering/structure.md#desktop-app-appsvibecutsrc.
# Foundation (kit, i18n, input) sits below shell. Home, Shorts and each editor
# area are independent features of one layer that import only foundation and
# shell; the editor frame is the one module above them that calls each area.

[[crate]]
name = "vibecut"
path = "apps/vibecut"

[[crate.layer]]
name = "foundation"
groups = ["foundation"]

[[crate.layer]]
name = "shell"
groups = ["shell"]

# Shared services sit below the windows and areas that call them.
[[crate.layer]]
name = "services"
groups = ["services"]

[[crate.layer]]
name = "features"
groups = [
    "home",
    "shorts",
    "assets",
    "properties",
    "timeline",
    "captions",
]

[[crate.layer]]
name = "frame"
groups = ["editor"]

[[crate.module]]
name = "kit"
group = "foundation"

[[crate.module]]
name = "i18n"
group = "foundation"

[[crate.module]]
name = "input"
group = "foundation"

[[crate.module]]
name = "appearance"
group = "foundation"

[[crate.module]]
name = "services"
group = "services"

[[crate.module]]
name = "actions"
group = "editor"

[[crate.module]]
name = "preferences"
group = "editor"

[[crate.module]]
name = "workspace"
group = "editor"

[[crate.module]]
name = "lifecycle"
group = "shell"

[[crate.module]]
name = "control"
group = "editor"

[[crate.module]]
name = "capture"
group = "shell"

[[crate.module]]
name = "media_panel"
group = "assets"

[[crate.module]]
name = "import"
group = "assets"

[[crate.module]]
name = "effects"
group = "assets"

[[crate.module]]
name = "effect_previews"
group = "assets"

[[crate.module]]
name = "panels"
group = "properties"

[[crate.module]]
name = "selection"
group = "properties"

[[crate.module]]
name = "color_picker"
group = "properties"

[[crate.module]]
name = "snapping"
group = "timeline"

[[crate.module]]
name = "subtitles"
group = "captions"

[[crate.module]]
name = "home"
group = "home"

[[crate.module]]
name = "editor"
group = "editor"

[[crate.module]]
name = "shorts"
group = "shorts"
