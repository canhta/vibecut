# Intra-crate layer table for `cargo xtask modules`.
#
# Layers are lowest first and imports go downward only. A module's group names
# the structure.md folder it belongs to; current flat files map to the future
# group so the direction is enforced before the folder move lands. Modules in a
# non-feature layer share that layer's group name, so kernel and substrate may
# collaborate internally; feature groups never import each other.
#
# Engine: docs/engineering/structure.md#engine.

[[crate]]
name = "engine"
path = "crates/engine"

[[crate.layer]]
name = "kernel"
groups = ["kernel"]

[[crate.layer]]
name = "substrate"
groups = ["substrate"]

[[crate.layer]]
name = "features"
groups = [
    "subtitles",
    "shorts",
    "analysis",
    "artifacts",
    "libraries",
    "providers",
]

[[crate.module]]
name = "session"
group = "kernel"

[[crate.module]]
name = "control"
group = "kernel"

[[crate.module]]
name = "jobs"
group = "substrate"

[[crate.module]]
name = "budget"
group = "substrate"

[[crate.module]]
