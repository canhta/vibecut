[package]
name = "vibecut"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autoexamples = false

[[bin]]
name = "vibecut"
path = "src/main.rs"

[[example]]
name = "ui_audit"
path = "examples/ui_audit.rs"
test = true

[[example]]
name = "preview_fixture"
path = "examples/preview_fixture.rs"

[lints]
workspace = true

[dependencies]
shorts.workspace = true
libraries.workspace = true
mcp.workspace = true
agent.workspace = true
pollster = "1.0.1"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }

rfd = { version = "0.17.2", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "accesskit", "x11", "wayland", "clipboard", "links"] }
egui_extras = { version = "0.37.0", features = ["svg"] }
cpal = "0.18.2"
media.workspace = true
engine.workspace = true
ai = { workspace = true, default-features = false }
project.workspace = true
render.workspace = true
text.workspace = true
time.workspace = true
captions.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sys-locale = "0.3.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
thiserror.workspace = true
transport.workspace = true
tracing = { workspace = true, default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
image = { workspace = true, default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(target_os = "linux")'.dependencies]
# rfd needs an explicit Linux backend once default features are off.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }

[dev-dependencies]
ai = { workspace = true, default-features = false, features = ["test-chat"] }
egui_kittest = { version = "0.37.0", features = ["wgpu", "eframe"] }
proptest.workspace = true
sha2.workspace = true
skrifa.workspace = true
tempfile.workspace = true
testkit.workspace = true
