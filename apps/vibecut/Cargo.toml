[package]
name = "vibecut"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vibecut"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rfd = { version = "0.17.2", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "accesskit", "x11", "wayland"] }
cpal = "0.18.2"
media = { path = "../../crates/media" }
engine = { path = "../../crates/engine" }
project = { path = "../../crates/project" }
render = { path = "../../crates/render" }
time = { path = "../../crates/time" }
captions = { path = "../../crates/captions" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu"] }
tempfile = "3.27.0"
