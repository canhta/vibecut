[package]
name = "vibecut-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vibecut-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
shorts.workspace = true
libraries.workspace = true
mcp.workspace = true
rmcp = { workspace = true, default-features = false, features = ["server", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "io-std", "net"] }
engine.workspace = true
ai.workspace = true
media.workspace = true
project.workspace = true
render.workspace = true
time.workspace = true
same-file = "1.0.6"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
testkit.workspace = true
