[package]
name = "vibecut-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vibecut-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
shorts.workspace = true
tracing = { workspace = true, default-features = false, features = ["std"] }
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util", "io-std", "net"] }
interprocess = { version = "2.4.7", features = ["tokio"] }
base64.workspace = true
engine.workspace = true
media.workspace = true
project.workspace = true
render.workspace = true
time.workspace = true
same-file = "1.0.6"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"
win-authorization-sys = "0.1.0"

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1.54.1", features = ["test-util"] }
testkit.workspace = true
