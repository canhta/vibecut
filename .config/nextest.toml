[test-groups]
media-fixtures = { max-threads = 1 }
subtitle-fixture = { max-threads = 1 }

# These generators use process-local locks/OnceLock and fixed file names.
# Nextest isolates each test in a process, so enforce exclusion in the runner.
[[profile.default.overrides]]
filter = 'package(media)'
test-group = 'media-fixtures'

[[profile.default.overrides]]
filter = 'package(engine) & binary(subtitles)'
test-group = 'subtitle-fixture'
