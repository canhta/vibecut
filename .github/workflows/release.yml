name: Release

# Signed releases are manual. A dry run performs every signing/smoke gate.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version to release, without v
        required: true
        type: string
      publish:
        description: Create the version tag and attach verified assets to a draft release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require main for a draft, and matching workspace version
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then test "$GITHUB_REF" = refs/heads/main; fi
          cargo xtask dist validate --version "$VERSION"

  distributions:
    needs: validate
    uses: ./.github/workflows/distribution.yml
    with:
      signed: true
    secrets: inherit

  draft:
    needs: distributions
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: distribution-macos-*
          path: dist
          merge-multiple: true
      - name: Attach verified DMGs and sums to one draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: cargo xtask dist publish release dist --version "$VERSION"
