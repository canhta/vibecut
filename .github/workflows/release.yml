name: Release

# Releases are manual: run this workflow from Actions with the version to ship.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must equal workspace.package.version, without the v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'canhta/vibecut'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require release credentials
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 .github/scripts/sign_macos.py validate
      - name: Require Apple Silicon, main and the workspace version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(uname -m)" = arm64
          test "$GITHUB_REF" = refs/heads/main
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['workspace']['package']['version']
          if os.environ['VERSION'] != version:
              raise SystemExit('Release version must match workspace.package.version')
          PY
      - uses: ./.github/actions/setup-build
        with:
          save-rust-cache: 'true'
      - name: Verify required media oracles
        run: |
          brew install ffmpeg
          cargo xtask ci --require-oracles
      - name: Build native distribution inputs
        run: |
          prefix=$(cat "$HOME/.cache/vibecut/ffmpeg/macos-aarch64/current")
          python3 packaging/build.py --ffmpeg "$prefix" --output target/release-inputs
          ffmpeg -nostdin -f lavfi -i testsrc2=size=64x64:rate=24 -t 1 -c:v mpeg4 target/release-smoke.mp4
      - name: Sign, notarize, staple and verify app and DMG
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          prefix=$(cat "$HOME/.cache/vibecut/ffmpeg/macos-aarch64/current")
          python3 .github/scripts/sign_macos.py sign "$prefix" target/release-inputs target/release-package
      - name: Remove temporary signing material
        if: always()
        run: python3 .github/scripts/sign_macos.py cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-macos-dmg
          path: |
            target/release-package/*.dmg
            target/release-smoke.mp4
          if-no-files-found: error
          retention-days: 7

  clean-host:
    needs: build
    # Separate VM: no Rust/media cache or developer FFmpeg is restored here.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-macos-dmg
          path: target/download
      - name: Install image and exercise app and CLI
        run: bash .github/scripts/install_smoke_macos.sh

  draft:
    needs: [build, clean-host]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-macos-dmg
          path: download
      - name: Attach verified DMG to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ inputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          mapfile -d '' images < <(find download -name '*.dmg' -print0)
          test "${#images[@]}" -eq 1
          # Never replace an existing asset or modify an already published release.
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            jq -e '.isDraft == true' release.json
            gh release upload "$RELEASE_TAG" "${images[0]}"
          else
            gh release create "$RELEASE_TAG" "${images[0]}" --target "$TARGET" --draft \
              --title "VibeCut $RELEASE_TAG" --notes 'Signed and notarized macOS Apple Silicon build; app and CLI smoke passed on a fresh hosted runner.'
          fi
