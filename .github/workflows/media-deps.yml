name: Media dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: macos-aarch64 }
          - { runner: macos-15-intel, platform: macos-x86_64 }
          - { runner: windows-latest, platform: windows-x86_64 }
          - { runner: windows-11-arm, platform: windows-aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Package cache with recipes and corresponding sources
        shell: bash
        run: tar -czf "ffmpeg-${{ matrix.platform }}.tar.gz" -C "$HOME/.cache/vibecut/ffmpeg" "${{ matrix.platform }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: ffmpeg-*.tar.gz
          if-no-files-found: error
