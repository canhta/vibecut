name: Media dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: macos-aarch64 }
          - { runner: macos-15-intel, platform: macos-x86_64 }
          - { runner: windows-latest, platform: windows-x86_64 }
          - { runner: windows-11-arm, platform: windows-aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf nasm
      - name: Install Windows source build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ runner.arch == 'ARM64' && 'CLANGARM64' || 'CLANG64' }}
          path-type: inherit
          install: >-
            make diffutils git tar
          pacboy: >-
            clang:p llvm:p lld:p cmake:p ninja:p pkgconf:p nasm:p
      - name: Resolve current LGPL libraries
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        run: cargo xtask ffmpeg --target ${{ matrix.platform }}
      - name: Package cache with recipes and corresponding sources
        shell: bash
        run: tar -czf "ffmpeg-${{ matrix.platform }}.tar.gz" -C "$HOME/.cache/vibecut/ffmpeg" "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: ffmpeg-*.tar.gz
          if-no-files-found: error
