name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      require-oracles:
        description: Require external ffmpeg/ffprobe and run media/render oracle tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.paths.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check workflow boundary behavior
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - id: paths
        run: python3 .github/scripts/changes.py

  docs:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo xtask docs

  lint:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Check formatting and repository policy
        run: cargo xtask checks

  test:
    name: test (macos-arm64)
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          save-rust-cache: 'true'
      - name: Install required media oracles
        run: brew install ffmpeg
      - name: Check Clippy
        run: cargo xtask clippy
      - name: Build and run workspace tests with required oracles
        run: cargo xtask test

  windows:
    name: test (windows-x64, advisory)
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          save-rust-cache: 'true'
      - name: Install required media oracles
        if: inputs.require-oracles
        run: choco install ffmpeg -y --no-progress
      - name: Check workspace
        shell: msys2 {0}
        env:
          REQUIRE_ORACLES: ${{ inputs.require-oracles }}
        run: |
          if [ "$REQUIRE_ORACLES" = true ]; then
            cargo xtask ci --require-oracles
          else
            cargo xtask ci
          fi

  gate:
    name: CI gate
    if: always()
    needs: [changes, docs, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/gate.py
