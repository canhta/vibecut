name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A merge to main never cancels the run before it: the running one finishes
  # and reports, and only the newest waiting run is kept.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo xtask docs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Check formatting and repository policy
        run: cargo xtask checks

  # Licences, sources, advisories and duplicate versions (deny.toml). It needs the
  # advisory database from the network, so it runs here rather than in
  # `cargo xtask checks`.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  # Clippy and the tests run as separate jobs on every platform: in one job a
  # lint error fails the step before `cargo xtask test`, which hid every test
  # result on main for five days.
  clippy:
    name: clippy (macos-arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          save-rust-cache: 'true'
      - name: Install required media oracles
        run: brew install ffmpeg
      - name: Check Clippy
        run: cargo xtask clippy

  clippy-linux:
    name: clippy (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          save-rust-cache: 'true'
      - name: Install required media oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check Clippy
        run: cargo xtask clippy

  clippy-windows:
    name: clippy (windows-x64, advisory)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          save-rust-cache: 'true'
      - name: Check Clippy
        shell: msys2 {0}
        run: cargo xtask clippy

  test:
    name: test (macos-arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          save-rust-cache: 'true'
      - name: Install required media oracles
        run: brew install ffmpeg
      - name: Build and run workspace tests with required oracles
        run: cargo xtask test

  test-linux:
    name: test (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          save-rust-cache: 'true'
      - name: Install required media oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build and run workspace tests with required oracles
        run: cargo xtask test

  test-windows:
    name: test (windows-x64, advisory)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          save-rust-cache: 'true'
      # Required-oracle mode reads PATH, so the system ffmpeg must exist before
      # `cargo xtask test`, exactly as brew and apt provide it on the other hosts.
      - name: Install required media oracles
        run: choco install ffmpeg -y --no-progress
      - name: Build and run workspace tests with required oracles
        shell: msys2 {0}
        run: cargo xtask test

  gate:
    name: CI gate
    if: always()
    needs: [docs, lint, deny, clippy, clippy-linux, test, test-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          jq -e '
            . as $needs |
            ["docs", "lint", "deny", "clippy", "clippy-linux", "test", "test-linux"] |
            all(.[]; $needs[.].result == "success")
          ' <<< "$NEEDS_JSON"
