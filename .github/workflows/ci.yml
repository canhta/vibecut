name: CI

on:
  workflow_dispatch:
    inputs:
      require-oracles:
        description: Require external ffmpeg/ffprobe and run media/render oracle tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install macOS media build tools
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf nasm
      - name: Install Windows source build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ runner.arch == 'ARM64' && 'CLANGARM64' || 'CLANG64' }}
          path-type: inherit
          install: >-
            make diffutils git tar
          pacboy: >-
            clang:p llvm:p lld:p cmake:p ninja:p pkgconf:p nasm:p
      - name: Provision current LGPL media libraries
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        run: cargo xtask ffmpeg
      - name: Install required media oracles (macOS)
        if: runner.os == 'macOS' && inputs.require-oracles
        run: brew install ffmpeg
      - name: Install required media oracles (Windows)
        if: runner.os == 'Windows' && inputs.require-oracles
        run: choco install ffmpeg -y --no-progress
      - name: Check workspace
        if: ${{ !inputs.require-oracles }}
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        run: cargo xtask ci
      - name: Check workspace with required media oracles
        if: ${{ inputs.require-oracles }}
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        run: cargo xtask ci --require-oracles
