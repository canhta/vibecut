name: Native build dependencies
description: Install Rust and reuse the current source-built LGPL FFmpeg
inputs:
  rust-cache:
    description: Restore Rust build dependencies (disable for archive-only runners)
    default: 'true'
  save-rust-cache:
    description: Save after successful Clippy and workspace tests
    default: 'false'
outputs:
  rust-hit:
    description: Exact Rust dependency cache hit
    value: ${{ steps.rust.outputs.cache-hit }}
  media-hit:
    description: Exact native media cache hit
    value: ${{ steps.media.outputs.cache-hit }}
  fixtures-hit:
    description: Exact fixture cache hit
    value: ${{ steps.fixtures.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      run: rustup toolchain install
    - name: Install Linux system libraries
      if: runner.os == 'Linux'
      shell: bash
      # cpal needs ALSA headers; offscreen egui tests need a Vulkan loader
      # and Mesa's software adapter, including when the media cache hits.
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev pkg-config libvulkan1 mesa-vulkan-drivers
    - id: rust
      if: inputs.rust-cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # Replace the automatic job key: lint/build/release can reuse main's deps.
        shared-key: deps-v3-${{ runner.os }}-${{ runner.arch }}
        # A tooling-only or metadata-only snapshot would leave an immutable
        # exact-hit cache missing compiled dependencies for every later build.
        save-if: ${{ inputs.save-rust-cache == 'true' && github.event_name != 'pull_request' }}
    - id: sherpa
      if: inputs.rust-cache == 'true'
      # sherpa-onnx-sys stores native archives outside Cargo's build OUT_DIR.
      # Save separately: rust-cache recursively cleans these non-Cargo files.
      # This action's post step runs before rust-cache's cleanup post step.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/sherpa-onnx-prebuilt
        key: sherpa-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
    - name: Reprovision Sherpa when its native cache is absent
      if: inputs.rust-cache == 'true' && steps.sherpa.outputs.cache-hit != 'true'
      shell: bash
      # A restored sys-crate fingerprint can otherwise refer to absent native
      # archives, including when this separate cache was independently evicted.
      # Old Rust caches also retain empty native directories; upstream treats
      # directory existence as provisioned, so discard that incomplete tree.
      run: |
        rm -rf -- target/sherpa-onnx-prebuilt
        cargo clean -p sherpa-onnx-sys
    - name: Install Windows source build tools
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        msystem: ${{ runner.arch == 'ARM64' && 'CLANGARM64' || 'CLANG64' }}
        path-type: inherit
        install: make diffutils git tar
        pacboy: clang:p llvm:p lld:p cmake:p ninja:p pkgconf:p nasm:p
    - name: Resolve upstream media versions
      id: versions
      shell: bash
      run: |
        media_versions=$(cargo xtask ffmpeg --cache-key)
        echo "key=$media_versions" >> "$GITHUB_OUTPUT"
    - id: media
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/vibecut/ffmpeg
        key: media-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.key }}-${{ hashFiles('xtask/src/ffmpeg.rs', 'xtask/src/ffmpeg/**', 'xtask/patches/**', 'rust-toolchain.toml') }}
    - name: Install macOS media build tools
      if: runner.os == 'macOS' && steps.media.outputs.cache-hit != 'true'
      shell: bash
      run: brew install cmake pkgconf nasm
    - name: Install Linux media build tools
      if: runner.os == 'Linux' && steps.media.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm lld cmake ninja-build nasm perl pkg-config make
    - name: Resolve and provision current LGPL media libraries (macOS)
      # Always resolve stable upstream tags, even after a cache hit.
      if: runner.os == 'macOS'
      shell: bash
      run: cargo xtask ffmpeg
    - name: Resolve and provision current LGPL media libraries (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: cargo xtask ffmpeg
    - name: Resolve and provision current LGPL media libraries (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: cargo xtask ffmpeg
    - name: Save provisioned media before downstream checks
      if: steps.media.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/vibecut/ffmpeg
        key: ${{ steps.media.outputs.cache-primary-key }}
    - name: Cache synthetic media fixtures
      id: fixtures
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target/fixtures/media
        key: fixtures-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/media/tests/**') }}
    - name: Cache receipt
      shell: bash
      env:
        RUST_HIT: ${{ steps.rust.outputs.cache-hit }}
        MEDIA_HIT: ${{ steps.media.outputs.cache-hit }}
        FIXTURES_HIT: ${{ steps.fixtures.outputs.cache-hit }}
      run: |
        echo "cache rust=$RUST_HIT media=$MEDIA_HIT fixtures=$FIXTURES_HIT"
        echo "Cache exact hits: Rust=$RUST_HIT; media=$MEDIA_HIT; fixtures=$FIXTURES_HIT" >> "$GITHUB_STEP_SUMMARY"
