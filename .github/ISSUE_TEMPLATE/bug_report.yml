name: Bug report
description: Report a reproducible problem.
title: "bug: "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, expected behavior and actual behavior. Exclude private media and secrets.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
    validations:
      required: true
